<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LeafCareBot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/static/leafrain-bg.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative; /* Cần cho lớp phủ */
        }
        body::before {
            content: '';
            position: fixed; /* Giữ lớp phủ cố định */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.6); /* Lớp phủ trắng mờ */
            z-index: -1; /* Đảm bảo lớp phủ nằm dưới nội dung */
            /* backdrop-filter: blur(5px); */ /* Hiệu ứng mờ cho lớp phủ (tùy chọn) */
        }
        .container {
            width: 90%; /* Tăng độ rộng */
            max-width: 700px; /* Đặt độ rộng tối đa */
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9); /* Nền container ít trong suốt hơn */
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 1;
            display: flex; /* Sử dụng flexbox cho bố cục bên trong container */
            flex-direction: column; /* Sắp xếp các phần tử theo cột */
            min-height: 80vh; /* Đặt chiều cao tối thiểu */
            max-height: 90vh; /* Đặt chiều cao tối đa */
        }
        h2 {
            text-align: center;
            color: #2e7d32;
            margin-top: 0; /* Bỏ margin top mặc định */
            margin-bottom: 15px; /* Thêm khoảng cách dưới */
        }
        nav {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            flex-shrink: 0; /* Ngăn nav bị co lại */
        }
        nav button {
            width: auto;
            margin: 0 5px;
            padding: 8px 16px;
            background-color: #66bb6a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease; /* Thêm hiệu ứng chuyển đổi */
        }
        nav button:hover {
            background-color: #4caf50;
        }
        /* Các input và button chung */
        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="file"],
        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #66bb6a;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #4caf50;
        }

        .hidden {
            display: none !important; /* Dùng !important để đảm bảo ghi đè */
        }

        /* --- START: Styles cho phần Chat --- */
        #chat {
            display: flex; /* Sử dụng flexbox cho phần chat */
            flex-direction: column; /* Sắp xếp các phần tử theo cột */
            flex-grow: 1; /* Cho phép phần chat chiếm hết không gian còn lại */
            justify-content: space-between; /* Đẩy chatbox lên trên, input xuống dưới */
        }

        .chatbox {
            flex-grow: 1; /* Cho phép chatbox chiếm hết không gian trống */
            overflow-y: auto; /* Bật thanh cuộn dọc */
            background-color: rgba(241, 248, 233, 0.8); /* Nền chatbox ít trong suốt hơn */
            padding: 15px; /* Tăng padding */
            border-radius: 10px;
            margin-bottom: 15px; /* Tăng khoảng cách dưới chatbox */
            display: flex; /* Sử dụng flexbox bên trong chatbox */
            flex-direction: column; /* Sắp xếp tin nhắn theo cột */
            gap: 10px; /* Khoảng cách giữa các tin nhắn */
        }

        .message {
            padding: 10px 15px; /* Tăng padding trong bong bóng */
            border-radius: 18px; /* Bo góc nhiều hơn */
            max-width: 80%; /* Giảm max-width để bong bóng nhỏ hơn */
            word-break: break-word;
            position: relative; /* Cần cho pseudo-elements nếu muốn đuôi */
            clear: both; /* Vẫn cần clear float nếu dùng float, nhưng flexbox trong chatbox tốt hơn */
        }

        .user-message {
            background-color: #e0f7fa; /* Màu xanh nhạt cho tin nhắn người dùng */
            align-self: flex-end; /* Căn bong bóng sang phải (dùng với flexbox trong chatbox) */
            color: #333; /* Màu chữ */
            /* Nếu không dùng flexbox trong chatbox, giữ float: right; text-align: right; */
        }

        .bot-message {
            background-color: #e8f5e9; /* Màu xanh lá nhạt cho tin nhắn bot */
            align-self: flex-start; /* Căn bong bóng sang trái (dùng với flexbox trong chatbox) */
            color: #333; /* Màu chữ */
            /* Nếu không dùng flexbox trong chatbox, giữ float: left; text-align: left; */
        }

        .chat-input-area {
            display: flex; /* Sử dụng flexbox để bố cục input và button */
            gap: 10px; /* Khoảng cách giữa input và button */
            flex-shrink: 0; /* Ngăn khu vực input bị co lại */
            align-items: center; /* Căn chỉnh theo chiều dọc */
        }

        .chat-input-area input[type="text"] {
            flex-grow: 1; /* Cho phép input chiếm hết không gian trống */
            margin-bottom: 0; /* Bỏ margin bottom mặc định */
        }

        .chat-input-area button {
            width: auto; /* Button có chiều rộng tự động */
            padding: 10px 20px; /* Tăng padding cho button gửi */
            margin-bottom: 0; /* Bỏ margin bottom mặc định */
            flex-shrink: 0; /* Ngăn button bị co lại */
        }
        /* --- END: Styles cho phần Chat --- */

        .diagnosis-result {
            text-align: center;
            margin-top: 15px; /* Thêm khoảng cách trên */
            padding: 10px;
            border: 1px solid #eee; /* Border nhẹ hơn */
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.7);
        }
        .diagnosis-img {
            max-width: 100%;
            height: auto; /* Đảm bảo tỷ lệ ảnh */
            border-radius: 8px; /* Bo góc nhẹ */
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* Thêm bóng nhẹ cho ảnh */
        }
        .link {
            text-align: center;
            color: #388e3c;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 15px; /* Thêm khoảng cách trên */
        }

        /* Styles cho phần Tính năng suất */
        #productivity h3 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 15px;
        }
        #productivity input[type="text"],
        #productivity input[type="number"],
        #productivity button {
             /* Giữ nguyên style chung */
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
         #productivity button {
            background-color: #66bb6a;
            color: white;
            border: none;
            cursor: pointer;
             transition: background-color 0.3s ease;
        }
        #productivity button:hover {
            background-color: #4caf50;
        }
        #productivityResult {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #eee; /* Border nhẹ hơn */
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        /* Media Queries cho thiết bị nhỏ hơn */
        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 15px;
                min-height: 90vh;
                max-height: 95vh;
            }
            .message {
                max-width: 90%;
                padding: 8px 12px;
                 border-radius: 15px;
            }
            .chatbox {
                padding: 10px;
                gap: 8px;
            }
             .chat-input-area {
                 gap: 5px;
             }
             .chat-input-area button {
                 padding: 10px 15px;
             }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌿 LeafCareBot</h2>

    <nav>
        <button onclick="showTab('login')">Login</button>
        <button onclick="showTab('chat')" id="chatTab" disabled>Chat</button>
        <button onclick="showTab('diagnosis')" id="diagnosisTab" disabled>Chẩn Đoán</button>
        <button onclick="showTab('productivity')" id="productivityTab" disabled>Tính Năng Suất</button>
    </nav>

    <div id="login">
        <h3>Đăng nhập</h3>
        <input type="text" id="loginUsername" placeholder="Tên đăng nhập">
        <input type="password" id="loginPassword" placeholder="Mật khẩu">
        <button onclick="login()">Đăng nhập</button>
        <div class="link" onclick="switchToRegister()">Chưa có tài khoản? Đăng ký</div>
    </div>

    <div id="register" class="hidden">
        <h3>Đăng ký</h3>
        <input type="text" id="registerUsername" placeholder="Tên đăng nhập">
        <input type="password" id="registerPassword" placeholder="Mật khẩu">
        <button onclick="register()">Đăng ký</button>
        <div class="link" onclick="switchToLogin()">Đã có tài khoản? Đăng nhập</div>
    </div>

    <div id="chat" class="hidden">
        <div class="chatbox" id="chatBox"></div>
        <input type="text" id="chatInput" placeholder="Nhập tin nhắn...">
        <button onclick="sendChat()">Gửi</button>
    </div>

    <div id="diagnosis" class="hidden">
        <h3>Chẩn Đoán Bệnh Cây</h3>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="sendDiagnosis()">Tải lên & Chẩn đoán</button>
        <div class="diagnosis-result" id="diagnosisResult"></div>
    </div>

    <div id="productivity" class="hidden">
        <h3>Tính Năng Suất</h3>
        <input type="text" id="locationInput" placeholder="Địa điểm (ví dụ: Hanoi, Buon Ma Thuot)">
        <input type="number" id="areaInput" placeholder="Diện tích (hectare)">
        <input type="number" id="numPlantsInput" placeholder="Số lượng cây">
        <button onclick="calculateProductivity()">Tính Toán</button>
        <div id="productivityResult" class="diagnosis-result"></div>
    </div>
</div>

<script>
    // const apiUrl = 'https://leafcarebot.onrender.com'; //
    const apiUrl = ' http://127.0.0.1:8000'

    function showTab(tab) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('register').classList.add('hidden');
        document.getElementById('chat').classList.add('hidden');
        document.getElementById('diagnosis').classList.add('hidden');
        document.getElementById('productivity').classList.add('hidden');
        document.getElementById(tab).classList.remove('hidden');
    }

    function switchToRegister() {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('register').classList.remove('hidden');
    }

    function switchToLogin() {
        document.getElementById('register').classList.add('hidden');
        document.getElementById('login').classList.remove('hidden');
    }

    async function login() {
        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;
        const response = await fetch(`${apiUrl}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            credentials: 'include'
        });

        const data = await response.json();
        if (response.ok) {
            alert("✅ Đăng nhập thành công");
            document.getElementById("chatTab").disabled = false;
            document.getElementById("diagnosisTab").disabled = false;
            document.getElementById("productivityTab").disabled = false;
            showTab('chat');
        } else {
            alert(data.detail || "❌ Đăng nhập thất bại");
        }
    }

    async function register() {
        const username = document.getElementById("registerUsername").value;
        const password = document.getElementById("registerPassword").value;
        const response = await fetch(`${apiUrl}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            credentials: 'include'
        });

        const data = await response.json();
        if (response.ok) {
            alert("✅ Đăng ký thành công! Hãy đăng nhập.");
            switchToLogin(); // 👉 Sau khi register thành công thì quay lại login
        } else {
            alert(data.detail || "❌ Đăng ký thất bại");
        }
    }

    async function sendChat() {
        const chatInput = document.getElementById("chatInput").value;
        if (!chatInput.trim()) return;

        const chatBox = document.getElementById("chatBox");
        const userDiv = document.createElement("div");
        userDiv.className = "message user-message";
        userDiv.innerText = chatInput;
        chatBox.appendChild(userDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        document.getElementById("chatInput").value = "";

        const response = await fetch(`${apiUrl}/chat/chatbot`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: chatInput }),
            credentials: 'include'
        });

        const data = await response.json();
        const botDiv = document.createElement("div");
        botDiv.className = "message bot-message";

        if (response.ok) {
            botDiv.innerText = data.response;
        } else {
            botDiv.innerText = data.detail || "❌ Lỗi khi chat";
        }
        chatBox.appendChild(botDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendDiagnosis() {
        const fileInput = document.getElementById("imageInput");
        if (!fileInput.files.length) {
            alert("❗ Vui lòng chọn ảnh");
            return;
        }
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        const diagnosisDiv = document.getElementById("diagnosisResult");
        diagnosisDiv.innerHTML = `<p>⏳ Đang chẩn đoán...</p>`;

        const response = await fetch(`${apiUrl}/diagnosis/diagnosis_plant`, {
            method: "POST",
            body: formData,
            credentials: 'include'
        });

        const data = await response.json();
        if (response.ok) {
            const imgURL = URL.createObjectURL(fileInput.files[0]);
            diagnosisDiv.innerHTML = `
                <img src="${imgURL}" class="diagnosis-img">
                <p><strong>🩺 Kết quả:</strong> ${data.response}</p>
            `;
        } else {
            diagnosisDiv.innerHTML = `<p>❌ Lỗi: ${data.detail}</p>`;
        }
    }

    async function calculateProductivity() {
      const location = document.getElementById("locationInput").value;
      const areaStr = document.getElementById("areaInput").value;
      const numPlantsStr = document.getElementById("numPlantsInput").value;
      const productivityDiv = document.getElementById("productivityResult");
      productivityDiv.innerHTML = `<p>⏳ Đang tính toán năng suất...</p>`;

      const area = parseInt(areaStr);
      const num_plants = parseInt(numPlantsStr);

      if (isNaN(area) || isNaN(num_plants)) {
          alert("❗ Vui lòng nhập số nguyên hợp lệ cho diện tích và số lượng cây.");
          productivityDiv.innerHTML = `<p>❌ Lỗi: Dữ liệu nhập không hợp lệ (diện tích và số lượng cây phải là số nguyên).</p>`;
          return;
      }

      const response = await fetch(`${apiUrl}/diagnosis/calculate_productivity`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ location, area, num_plants }),
          credentials: 'include'
      });

      const data = await response.json();
      if (response.ok) {
          productivityDiv.innerHTML = `<p><strong>📊 Năng suất:</strong> ${data.response}</p>`;
      } else {
          productivityDiv.innerHTML = `<p>❌ Lỗi: ${data.detail}</p>`;
      }
    }
</script>

</body>
</html>
